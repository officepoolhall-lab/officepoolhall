<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 8-ball. The "8" is two stroked circles (no font), so it renders identically everywhere.
       Proportions are bolder than a real ball so the 8 still reads at 16px. -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0a" stroke="#3a3a3c" stroke-width="2"/>
  <ellipse cx="19" cy="15" rx="7" ry="4" fill="#ffffff" opacity="0.12" transform="rotate(-35 19 15)"/>
  <circle cx="32" cy="32" r="18" fill="#f5f5f7"/>
  <circle cx="32" cy="25.4" r="4.6" fill="none" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="32" cy="37.2" r="5.8" fill="none" stroke="#0a0a0a" stroke-width="4"/>
</svg>
